services:
  web:
    container_name: koios_web
    image: nginx:alpine
    ports:
      - "{INGRESS_PORT:-8001}:80"
    volumes:
      - ./app/static/:/static/:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped


  app:
    container_name: koios_app
    build:
      context: ./
      dockerfile: ./docker/Dockerfile
      args:
        APT_PACKAGES: ${APT_PACKAGES:-}
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./app/:/usr/src/app/
      - ${DATA_DIR:-./data}/koios/:/var/lib/koios/data/
      - ${LOG_DIR:-/tmp/koios/logs}/koios/:/var/log/koios/
    env_file:
      - ./.env
    depends_on:
      - db
    restart: unless-stopped


  db:
    container_name: koios_database
    image: pgvector/pgvector:pg17-trixie
    volumes:
      - ${DATA_DIR:-./data}/db/:/var/lib/postgresql/data/
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    env_file:
      - ./.env
    environment:
      POSTGRES_DB:       ${KOIOS_DB_NAME:-koios}
      POSTGRES_USER:     ${KOIOS_DB_USER:-koios}
      POSTGRES_PASSWORD: ${KOIOS_DB_PASS}
    restart: unless-stopped
