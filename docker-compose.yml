services:
  web:
    container_name: koios_web
    image: nginx:alpine
    ports:
      - "8001:80"
    volumes:
      - ./app/static/:/static/:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    container_name: koios_app
    build:
      context: ./
      dockerfile: ./docker/Dockerfile
      args:
        APT_PACKAGES: ${APT_PACKAGES:-}
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./app/:/usr/src/app/
    env_file:
      - ./.env
    depends_on:
      - db
    restart: unless-stopped

  db:
    container_name: koios_database
    image: pgvector/pgvector:pg17-trixie
    volumes:
      - /tmp/koios/data/db/:/var/lib/postgresql/data/
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file:
      - ./.env
    environment:
      POSTGRES_DB:       ${KOIOS_DB_NAME}
      POSTGRES_USER:     ${KOIOS_DB_USER}
      POSTGRES_PASSWORD: ${KOIOS_DB_PASS}
    restart: unless-stopped
